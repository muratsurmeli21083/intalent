<style>

            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

            background-color: #f7f9fb;
            background-image: radial-gradient(#003ec7 0.5px, transparent 0.5px), radial-gradient(#003ec7 0.5px, #f7f9fb 0.5px);

            background-position: 0 0, 10px 10px;
            opacity: 0.03;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }

<main class="relative z-10 w-full max-w-md px-margin-mobile flex flex-col items-center">

<div class="flex items-center justify-center mb-base">

</div>

</header>

<div class="text-center mb-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Hoş Geldiniz</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Lütfen profesyonel hesabınızla giriş yapın.</p>
</div>

<span class="font-label-bold text-label-bold text-outline uppercase">veya</span>

</div>

<label class="block text-label-bold text-on-surface-variant mb-xs ml-1" for="password-input">Şifre</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-sm font-body-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/50" id="password-input" placeholder="Şifreniz" type="password"/>
</div>
</div>
<button class="w-full py-sm px-md bg-secondary text-on-secondary rounded-xl font-label-bold text-label-bold hover:bg-on-secondary-fixed-variant transition-all active:scale-[0.98] shadow-sm">
                    Devam Et
                </button>

<div class="relative flex items-center pt-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary transition-all cursor-pointer" id="kvkk-consent" type="checkbox"/>
</div>

<div class="flex items-center gap-xs text-outline">

<span class="font-label-bold text-[10px] tracking-widest uppercase">Güvenli Altyapı</span>
</div>
<div class="flex items-center gap-xs text-outline">
<span class="material-symbols-outlined text-[18px]">analytics</span>
<span class="font-label-bold text-[10px] tracking-widest uppercase">Veri Odaklı</span>
</div>
</div>
</footer>
</main>
